[package]
name = "sagyodai-core"
version = "0.1.0"
edition = "2024"

[dependencies]
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
regex = "1"
csv = "1.4"
axum = "0.8"
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "net", "sync", "time"] }
rmcp = { version = "3.11.0", features = ["transport-io", "schemars"] }
schemars = "1"
